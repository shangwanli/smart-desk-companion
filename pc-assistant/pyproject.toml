[project]
name = "smart-desk-companion"
version = "0.1.0"
description = "AI-powered desktop robot companion - PC assistant"
requires-python = ">=3.10"

dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
ai = [
    "faster-whisper>=1.0.0",
    "openai>=1.0.0",
    "edge-tts>=6.0.0",
    "pyaudio>=0.2.0",
    "numpy>=1.24.0",
    "pygame>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["server*", "audio*", "ai*", "controller*", "utils*"]
